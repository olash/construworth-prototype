mponent extends DCLogic {\n  constructor(props) { super(props); this.state = { open: 'A', sent: false, name: '', contact: '', err: false }; }\n  renderVals() {\n    const S = this.state;\n    const fmt = (n) => '₦' + n.toLocaleString('en-NG');\n    const els = [\n      { code: 'A', name: 'Substructure', amount: 58400000, items: [{ d: 'Excavation for ground beams', q: '64 m³' }, { d: 'Reinforced concrete raft', q: '83 m³' }, { d: 'Bar reinforcement', q: '26.89 t' }, { d: 'Damp-proof membrane', q: '417 m²' }] },\n      { code: 'B', name: 'Frame', amount: 41200000, items: [{ d: 'Concrete columns', q: '30 m³' }, { d: 'Beams', q: '53 m³' }, { d: 'Bar reinforcement', q: '21.84 t' }] },\n      { code: 'C', name: 'Upper floors', amount: 33700000, items: [{ d: 'Suspended slab', q: '147 m³' }, { d: 'Soffit formwork', q: '980 m²' }] },\n      { code: 'D', name: 'Roof', amount: 22900000, items: [{ d: 'Longspan aluminium roofing', q: '205 m²' }, { d: 'Liquid waterproofing', q: '126 m²' }] },\n      { code: 'F', name: 'External walls', amount: 27500000, items: [{ d: '230 mm sandcrete blockwork', q: '765 m²' }, { d: '150 mm sandcrete blockwork', q: '16 m²' }] },\n      { code: 'H', name: 'Windows and doors', amount: 128600000, items: [{ d: 'Aluminium windows and doors', q: 'PC sum' }, { d: 'Security doors', q: 'PC sum' }] }\n    ];\n    const total = els.reduce((a, e) => a + e.amount, 0);\n    const elements = els.map((e) => { const open = S.open === e.code; return { ...e, open, expanded: open ? 'true' : 'false', amountFmt: fmt(e.amount), toggle: () => this.setState({ open: open ? null : e.code }) }; });\n    const st = [\n      { n: '01', q: 'Is it worth building?', service: 'Feasibility studies', body: 'We test land, construction cost, market and financing against what the finished building can earn or be worth.', docs: ['Feasibility report', 'Development appraisal'] },\n      { n: '02', q: 'What will it cost?', service: 'Cost planning', body: 'As the architect draws, we price. An elemental cost plan keeps the design and the budget moving together.', docs: ['Elemental cost plan', 'Cost checks at each design stage'] },\n      { n: '03', q: 'Who builds it, and on what terms?', service: 'Contract documentation', body: 'We measure every item into a Bill of Quantities, run the tender, compare bids line by line and prepare the contract.', docs: ['Bill of Quantities', 'Tender report', 'Contract documents'] },\n      { n: '04', q: 'Is the money under control?', service: 'Cost control', body: 'Each month we value the work done on site and certify what the contractor is owed, less retention. Variations are priced before they are built.', docs: ['Cash flow forecast', 'Monthly payment certificates', 'Cost reports'] },\n      { n: '05', q: 'What is the final bill?', service: 'Valuation and final account', body: 'Half the retention is released at practical completion. After the defects period we agree the final account and close the books.', docs: ['Final payment certificate', 'Final account'] },\n      { n: '06', q: 'What if we disagree?', service: 'Arbitration', body: 'When claims arise we assess them on the record — measurements, certificates and instructions — and help settle them without stopping the job.', docs: ['Claims assessment', 'Expert report'] }\n    ].map((s, i) => ({ ...s, is1: i === 0, is2: i === 1, is3: i === 2, is4: i === 3, is5: i === 4, is6: i === 5 }));\n    const phases = [\n      { name: 'Before you build', note: 'We price it', stages: st.slice(0, 3) },\n      { name: 'While it rises', note: 'We control it', stages: st.slice(3, 4) },\n      { name: 'After handover', note: 'We close it', stages: st.slice(4) }\n    ];\n    const showErr = S.err && !S.contact.trim();\n    return {\n      elements, total: fmt(total), phases,\n      sent: S.sent, notSent: !S.sent, nameOrThere: S.name.trim() || 'there',\n      f: { name: S.name, contact: S.contact },\n      setName: (e) => this.setState({ name: e.target.value }),\n      setContact: (e) => this.setState({ contact: e.target.value }),\n      showErr, contactInvalid: showErr ? 'true' : 'false', contactBorder: showErr ? '#FFB07A' : '#8A8F93',\n      submit: (e) => { e.preventDefault(); if (!S.contact.trim()) { this.setState({ err: true }); return; } this.setState({ sent: true, err: false }); },\n      reset: () => this.setState({ sent: false, name: '', contact: '', err: false })\n    };\n  }\n}\n","props":{"$preview":{"width":1440,"height":5400}}},"mobile":{"name":"R2-Home-Mobile","tree":[" ",["div",{"style":"font-family: 'Archivo', sans-serif; font-size: 16px; line-height: 1.55; color: #1D2023; background: #F5F6F4; min-height: 100%"},[" ",["a",{"class":"skip","href":"#main"},["Skip to content"]]," ",["header",{"style":"display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #D5D9DC"},[" ",["a",{"href":"/","aria-label":"Construworth Consult home","style":"display: flex; align-items: center; gap: 8px; text-decoration: none; min-height: 44px"},[" ",["span",{"aria-hidden":"true","class":"d","style":"font-size: 24px; line-height: 1"},[["span",{"style":"color: #5F6366"},["C"]],["span",{"style":"color: #E8731C"},["W"]]]]," ",["span",{"style":"font-weight: 600; font-size: 16px"},["Construworth"]]," "]]," ",["button",{"type":"button","onClick":"{{toggleMenu}}","aria-expanded":"{{menuExpanded}}","aria-controls":"m-nav","style":"min-width: 44px; min-height: 44px; padding: 0 14px; border: 1.5px solid #1D2023; background: transparent; color: #1D2023; font: inherit; font-weight: 500; cursor: pointer"},["{{menuLabel}}"]]," "]]," ",["sc-if",{"value":"{{menuOpen}}","hint-placeholder-val":"{{false}}"},[" ",["nav",{"id":"m-nav","aria-label":"Main","style":"background: #1D2023; padding: 8px 16px 20px; display: flex; flex-direction: column"},[" ",["a",{"href":"#services","class":"d","style":"color: #F5F6F4; text-decoration: none; font-size: 32px; padding: 10px 0; border-bottom: 1px solid #3A3E42"},["Services"]]," ",
