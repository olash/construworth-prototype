.z;\\n' +\n    ' vec3 c = vCol * (0.42 + 0.50 * d) + vCol * vec3(0.05, 0.07, 0.10) * up;\\n' +\n    ' if (vStage == cur && uProg \u003c 8.0) { float front = 1.0 - smoothstep(0.0, 0.9, cut - vW.z); c = mix(c, uAccent, 0.14 + 0.6 * front); }\\n' +\n    ' float dist = length(uEye - vW); c = mix(c, uBg, clamp((dist - 60.0) / 160.0, 0.0, 0.5));\\n' +\n    ' o = vec4(c, uAlpha);\\n' +\n    '}';\n  var GVS = '#version 300 es\\nin vec2 aP; uniform mat4 uMVP; uniform float uZg; uniform vec4 uR; out vec2 vP;\\n' +\n    'void main(){ vec2 p = mix(uR.xy, uR.zw, aP); vP = p; gl_Position = uMVP * vec4(p, uZg, 1.0); }';\n  var GFS = '#version 300 es\\nprecision highp float; in vec2 vP; out vec4 o; uniform vec3 uBg; uniform vec3 uLine; uniform vec2 uC; uniform float uRad;\\n' +\n    'float g(float s){ vec2 q = abs(fract(vP / s - 0.5) - 0.5) / fwidth(vP / s); return 1.0 - min(min(q.x, q.y), 1.0); }\\n' +\n    'void main(){ float r = length(vP - uC) / uRad; float fade = 1.0 - smoothstep(0.35, 1.0, r);\\n' +\n    ' float l = max(g(1.0) * 0.35, g(5.0)); vec3 c = mix(uBg, uLine, l * 0.5 * fade); o = vec4(c, 1.0); }';\n  var P = prog(VS, FS), G = prog(GVS, GFS);\n  var U = {}; ['uMVP', 'uMin', 'uSpan', 'uProg', 'uClip', 'uSun', 'uMode', 'uAlpha', 'uAccent', 'uEye', 'uBg', 'uGhost'].forEach(function (k) { U[k] = gl.getUniformLocation(P, k); });\n  var uZ = gl.getUniformLocation(P, 'uZ');\n  var UG = {}; ['uMVP', 'uZg', 'uR', 'uBg', 'uLine', 'uC', 'uRad'].forEach(function (k) { UG[k] = gl.getUniformLocation(G, k); });\n\n  var chunks = data.chunks.map(function (c) {\n    var vao = gl.createVertexArray(); gl.bindVertexArray(vao);\n    var pb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pb); gl.bufferData(gl.ARRAY_BUFFER, c.pos, gl.STATIC_DRAW);\n    var la = gl.getAttribLocation(P, 'aPos'); gl.enableVertexAttribArray(la); gl.vertexAttribPointer(la, 3, gl.UNSIGNED_SHORT, true, 0, 0);\n    var cb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cb); gl.bufferData(gl.ARRAY_BUFFER, c.
