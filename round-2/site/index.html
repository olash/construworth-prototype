'Who builds it, and on what terms?', service: 'Contract documentation', body: 'We measure every item into a Bill of Quantities, run the tender, compare bids line by line and prepare the contract.', docs: ['Bill of Quantities', 'Tender report', 'Contract documents'] },\n      { n: '04', q: 'Is the money under control?', service: 'Cost control', body: 'Each month we value the work done on site and certify what the contractor is owed, less retention. Variations are priced before they are built.', docs: ['Cash flow forecast', 'Monthly payment certificates', 'Cost reports'] },\n      { n: '05', q: 'What is the final bill?', service: 'Valuation and final account', body: 'Half the retention is released at practical completion. After the defects period we agree the final account and close the books. We also value property for investment, insurance and reporting.', docs: ['Final payment certificate', 'Final account', 'Valuation reports'] },\n      { n: '06', q: 'What if we disagree?', service: 'Arbitration', body: 'When claims arise we assess them on the record (measurements, certificates and instructions) and help settle them without stopping the job.', docs: ['Claims assessment', 'Expert report'] }\n    ].map((s, i) => ({ ...s, is1: i === 0, is2: i === 1, is3: i === 2, is4: i === 3, is5: i === 4, is6: i === 5 }));\n    const phases = [\n      { name: 'Before you build', note: 'We price it', stages: st.slice(0, 3) },\n      { name: 'While it rises', note: 'We control it', stages: st.slice(3, 4) },\n      { name: 'After handover', note: 'We close it', stages: st.slice(4) }\n    ];\n    return { elements, total: fmt(total), phases };\n  }\n}\n","props":{"$preview":{"width":1440,"height":6200}}},"mobile":null},"comps":{"R2-J77A-Model":{"name":"R2-J77A-Model","tree":[" ",["div",{"style":"font-family: 'Archivo', sans-serif; font-size: 16px; line-height: 1.5; color: #F2EEE7; background: #16181A; border: 1px solid #3A3D40"},[" ",["div",{"style":"display: flex; flex-wrap: wrap; ali
