'PC'], ['Hardwood door subframes', 30, 'nr', 85000], ['Install doors complete', 30, 'nr', 45000]]],\n      ['M', 'Floor finishes', [['Vitrified floor tiles 1000 × 1000', 1005, 'm²', 58000], ['Marble floor slab', 17, 'm²', 95000], ['30 mm cement and sand screed', 1075, 'm²', 4500], ['Cementitious waterproofing, wet areas', 213, 'm²', 9000]]],\n      ['N', 'Wall finishes', [['Internal render, 12 mm', 3419, 'm²', 3800], ['POP screeding', 3419, 'm²', 2500], ['Glazed wall tiles', 685, 'm²', 52000], ['Porcelain external cladding', 823, 'm²', 62000], ['Emulsion paint, 3 coats', 3419, 'm²', 2200]]],\n      ['P', 'Ceiling finishes', [['Suspended plasterboard ceiling', 904, 'm²', 14500], ['Moisture-resistant board, wet areas', 188, 'm²', 17500], ['Emulsion to ceilings', 1092, 'm²', 2000], ['Undefined ceiling works', 1, 'item', 2000000, 'PS']]],\n      ['Q', 'Fittings and furnishing', [['Shelving, closets and wardrobes', 1, 'item', 30000000, 'PC'], ['Kitchen cabinets and equipment', 1, 'item', 100000000, 'PC'], ['Granite vanity tops', 20, 'm', 75000]]]\n    ];\n    const TT = { PC: 'Prime cost sum: an allowance for a specialist item chosen later', PS: 'Provisional sum: money set aside for work not yet defined' };\n    const els = B.map(([code, name, rows]) => {\n      const rr = rows.map(([d, q, u, rate, tag]) => ({ d, q: n0(q), u, rate: tag ? '—' : n0(rate), amt: n2(q * rate), val: q * rate, tag: tag || '', tagTitle: TT[tag] || '', tagBg: tag === 'PC' ? '#F6C9A3' : '#D5DDE5' }));\n      return { code, name, rows: rr, total: rr.reduce((a, r) => a + r.val, 0) };\n    });\n    const bill2 = els.reduce((a, e) => a + e.total, 0);\n    const elements = els.map((e) => { const on = e.code === S.el; return { code: e.code, name: e.name, short: short(e.total), current: on ? 'true' : 'false',\n      bg: on ? '#1D2023' : 'transparent', fg: on ? '#F5F6F4' : '#1D2023', codeColor: on ? '#F4A367' : '#A84A0A', pick: () => this.setState({ el: e.code }) }; });\n    const selE = els.find((e) => e.code === S.el) || els[0];\n    const sel = { ...selE, totalFmt: naira(selE.total) };\n    const bill3 = 68500000, bill4 = 212000000, cont = 30000000;\n    const bill1 = Math.round((bill2 + bill3 + bill4) * 0.06);\n    const sub = bill1 + bill2 + bill3 + bill4 + cont;\n    const vat = sub * 0.075;\n    const summary = [\n      { k: 'Bill No. 1, preliminaries', v: n2(bill1) }, { k: 'Bill No. 2, main building', v: n2(bill2) },\n      { k: 'Bill No. 3, external works', v: n2(bill3) }, { k: 'Bill No. 4, mechanical and electrical', v: n2(bill4) },\n      { k: 'Contingency', v: n2(cont) }, { k: 'VAT at 7.5%', v: n2(vat) }\n    ].map((s) => ({ ...s, w: 400 })).concat([{ k: 'Tender sum', v: naira(sub + vat), w: 600 }]);\n\n    const sumsVals = [250e6, 500e6, 1e9];\n    const C = sumsVals[S.sum];\n    const pct = [2, 3, 5, 8, 11, 13, 14, 13, 11, 9, 7, 4];\n    const labels = ['Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb'];\n    const fullLabels = ['March 2026', 'April 2026', 'May 2026', 'June 2026', 'July 2026', 'August 2026', 'September 2026', 'October 2026', 'November 2026', 'December 2026', 'January 2027', 'February 2027'];\n    let cum = 0; const cumArr = pct.map((p) => (cum += p));\n    const pt = (i) => ((i + 0.5) * 100).toFixed(0) + ',' + (290 - cumArr[i] * 2.7).toFixed(1);\n    const months = pct.map((p, i) => ({ label: labels[i], h: (p / 14 * 72).toFixed(1) + '%',\n      bg: i === S.month ? '#E8731C' : (i \u003c S.month ? '#C8B49C' : '#E6E9EB'), pressed: i === S.month ? 'true' : 'false',\n      aria: fullLabels[i] + ': ' + p + '% of the contract', pick: () => this.setState({ month: i }) }));\n    const m = S.month, gross = C * pct[m] / 100, ret = gross * 0.05;\n    const mobRec = S.mob ? gross * 0.15 : 0;\n    const last = m === 11, moiety = last ? C * 0.025 : 0;\n    const net = gross - ret - mobRec + moiety, mvat = net * 0.075;\n    const lines = [{ k: 'Value of work this month', v: n2(gross) }, { k: 'Less retention at 5%', v: '(' + n2(ret) + ')' }];\n    if (S.mob) lines.push({ k: 'Less mobilisation recovered', v: '(' + n2(mobRec) + ')' });\n    if (last) lines.push({ k: 'Add half the retention (moiety)', v: n2(moiety) });\n    lines.push({ k: 'VAT at 7.5%', v: n2(mvat) });\n    const cur = { full: fullLabels[m], cumPct: cumArr[m] + '%', cumAmt: short(C * cumArr[m] / 100),\n      lines: lines.map((l) => ({ ...l, w: 400 })).concat([{ k: 'Due to the contractor', v: naira(net + mvat), w: 600 }]),\n      note: last ? 'Practical completion. Half the retention held so far, 2.5% of the contract, is released this month.'\n        : (m \u003c 3 ? 'Early months are light: site set-up and substructure. Spending speeds up as the frame rises.' : (m \u003c 8 ? 'Peak spending. Frame, roof and envelope are all under way, so this is where cost control matters most.' : 'Spending tapers into finishes and services. Retention keeps 5% back until the job is complete.')) };\n    const sums = sumsVals.map((v, i) => ({ label: short(v), pressed: i === S.sum ? 'true' : 'false', bg: i === S.sum ? '#E8731C' : 'transparent', pick: () => this.setState({ sum: i }) }));\n\n    const matVals = [0, 5e6, 12e6];\n    const work = C * S.work / 100, mat = matVals[S.mat], g = work + mat;\n    const retain = g * 0.05, released = S.pc ? retain / 2 : 0;\n    const prev = C * Math.max(0, S.work - 9) / 100 * 0.95;\n    const vnet = g - retain + released - prev, vv = Math.max(0, vnet) * 0.075;\n    const vlines = [{ k: 'Value of work done to date', v: n2(work) }, { k: 'Materials on site', v: n2(mat) }, { k: 'Gross value', v: n2(g), w: 600 }, { k: 'Less retention at 5%', v: '(' + n2(retain) + ')' }];\n    if (S.pc) vlines.push({ k: 'Add retention released at completion', v: n2(released) });\n    vlines.push({ k: 'Less previous certificates', v: '(' + n2(prev) + ')' }, { k: 'Net amount', v: n2(vnet), w: 600 }, { k: 'VAT at 7.5%', v: n2(vv) });\n    const val = { work: S.work, workPct: S.work + '%', no: Math.max(1, Math.round(S.work / 12)), lines: vlines.map((l) => ({ w: 400, ...l })), due: naira(Math.max(0, vnet + vv)) };\n    const mats = matVals.map((v, i) => ({ label: v ? short(v) : 'None', pressed: i === S.mat ? 'true' : 'false', bg: i === S.mat ? '#E8731C' : 'transparent', pick: () => this.setState({ mat: i }) }));\n\n    const T = [['tab-boq', 'Bill of Quantities', 'Sample bill: main building'], ['tab-cash', 'Cash flow forecast', 'Sample cash flow: 12 months'], ['tab-pay', 'Payment certificate', 'Sample monthly payment certificate']];\n    const tabs = T.map((t, i) => ({ id: t[0], label: t[1], selected: i === S.tab ? 'true' : 'false', bg: i === S.tab ? '#1D2023' : 'transparent', fg: i === S.tab ? '#F5F6F4' : '#1D2023', pick: () => this.setState({ tab: i }) }));\n    const EX = [\n      { title: 'Every item, measured and priced.', body: 'We measure every material and task from the drawings into one list. Every contractor prices the same list, so bids compare line by line and you know exactly what you are paying for.',\n        terms: [{ k: 'PC sum (prime cost)', v: 'An allowance for a specialist item chosen later, such as windows or a kitchen.' }, { k: 'PS (provisional sum)', v: 'Money set aside for work that is not fully defined yet.' }, { k: 'Carried to collection', v: 'Page totals roll up into element totals, then into the general summary.' }],\n        lead: 'Need your drawings measured?' },\n      { title: 'When the money goes out.', body: 'A cash flow forecast shows how much you need each month, so funding is ready before the contractor asks for it. Spending follows an S-curve: a slow start, a fast middle and a long tail.',\n        terms: [{ k: 'Retention (5%)', v: 'Held back from each payment as security that defects get fixed.' }, { k: 'Moiety (2.5%)', v: 'Half of the retention, released at practical completion.' }, { k: 'Mobilisation advance', v: 'An upfront payment to get the contractor on site, recovered from later payments.' }],\n        lead: 'Planning how to fund a project?' },\n      { title: 'Pay for work done, and nothing more.', body: 'Each month we measure progress on site, value it against the Bill of Quantities and certify what the contractor is owed. You pay on our certificate.',\n        terms: [{ k: 'Payment certificate', v: 'Also called an interim valuation: the monthly payment document signed by the QS.' }, { k: 'Previous certificates', v: 'What has already been paid, deducted so nothing is paid twice.' }, { k: 'Final account', v: 'The last certificate, agreed after the defects liability period.' }],\n        lead: 'Want independent control of payments?' }\n    ];\n\n    const PR = [['Preliminaries', 0, 11], ['A Substructure', 0, 2], ['B Frame', 3, 6], ['C Upper floors', 3, 6], ['E Staircases', 5, 6], ['D Roof', 6, 8], ['F External walls', 6, 11], ['G Internal walls', 6, 8], ['H Windows and external doors', 6, 9], ['J Internal doors', 6, 9], ['K Plumbing and mechanical', 3, 10], ['L Electrical', 3, 9], ['N Wall finishes', 7, 8], ['M Floor finishes', 9, 10], ['Q Fittings and furnishing', 9, 10], ['Lift and sanitaryware ordered', 5, 5], ['External works, gatehouse and pool', 8, 9], ['Lighting and electrical accessories', 10, 11], ['Planting', 11, 11]];\n    const MOH = ['M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D', 'J', 'F'];\n    const progRows = PR.map(([n, a, b]) => ({ n, cells: MOH.map((_, k) => ({ bg: k >= a && k \u003c= b ? (k === S.month ? '#E8731C' : '#D9B48F') : (k === S.month ? '#F1EEE7' : 'transparent') })) }));\n    const onSite = PR.filter(([n, a, b]) => S.month >= a && S.month \u003c= b).map(([n]) => n.replace(/^[A-Z] /, ''));\n    return {\n      progRows, moh: MOH, onSite: onSite.map((n) => ({ n })), onSiteCount: onSite.length,\n      tabs, fileName: T[S.tab][2], activeTabId: T[S.tab][0], isBoq: S.tab === 0, isCash: S.tab === 1, isVal: S.tab === 2, explain: EX[S.tab],\n      elements, sel, summary,\n      sums, sumFmt: short(C), mob: S.mob, toggleMob: () => this.setState({ mob: !S.mob }),\n      months, planPts: '0,290 ' + pct.map((_, i) => pt(i)).join(' '), actPts: '0,290 ' + pct.slice(0, S.month + 1).map((_, i) => pt(i)).join(' '), cur,\n      val, mats, setWork: (e) => this.setState({ work: Number(e.target.value) }),\n      pc: S.pc, togglePc: () => this.setState({ pc: !S.pc })\n    };\n  }\n}\n","props":{"$preview":{"width":1440,"height":2000}}},"mobile":{"name":"R2-Desk-Mobile","tree":[" ",["div",{"style":"font-family: 'Archivo', sans-serif; font-size: 16px; line-height: 1.55; color: #1D2023; background: #F5F6F4; min-height: 100%"},[" ",["header",{"style":"display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #D5D9DC"},[" ",["a",{"href":"/","aria-label":"Construworth Consult home","style":"display: flex; align-items: center; gap: 8px; text-decoration: none; min-height: 44px"},[" ",["span",{"aria-hidden":"true","class":"d","style":"font-size: 24px; line-height: 1"},[["span",{"style":"color: #5F6366"},["C"]],["span",{"style":"color: #E8731C"},["W"]]]]," ",["span",{"style":"font-weight: 600"},["Construworth"]]," "]]," ",["a",{"href":"/","style":"min-height: 44px; display: inline-flex; align-items: center"},["Home"]]," "]]," ",["main",{},[" ",["section",{"style":"padding: 32px 16px 18px"},[" ",["h1",{"class":"d","style":"margin: 0; font-size: 56px; line-height: 0.88"},["Cost tools"]]," ",["p",{"style":"margin: 12px 0 0; color: #3A3E42"},["Three documents we produce on most jobs. Change the inputs and the totals follow. Figures are illustrative."]]," "]]," ",["div",{"role":"tablist","aria-label":"Documents","style":"position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1.5px solid #1D2023; border-bottom: 1.5px solid #1D2023; background: #F5F6F4"},[" ",["sc-for",{"list":"{{tabs}}","as":"t","hint-placeholder-count":"3"},[" ",["button",{"type":"button","role":"tab","aria-selected":"{{t.selected}}","aria-controls":"panel","onClick":"{{t.pick}}","style":" isplay: flex; align-items: center; justify-content: center; background: #1D2023; color: #F5F6F4; text-decoration: none; min-height: 54px; font-weight: 500"},["Send a project brief"]]," "]]," "]]," "]]],"styles":["\nbody{margin:0;background:#F5F6F4}\na{color:#1D2023;text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#A84A0A}\n.d{font-family:'Archivo',sans-serif;font-stretch:72%;font-weight:700;letter-spacing:-0.015em}\n.n{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}\n.dots{flex:1 1 12px;min-width:10px;border-bottom:2px dotted currentColor;opacity:.35;margin:0 8px .3em}\n:focus-visible{outline:3px solid #1D2023;outline-offset:2px}\ninput[type=range]{accent-color:#E8731C}\n"],"links":["https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap"],"script":"\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { tab: 0, el: 'A', sum: 1, month: 6, work: 62, pc: false }; }\n  renderVals() {\n    const S = this.state;\n    const n2 = (n) => n.toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n    const n0 = (n) => n.toLocaleString('en-NG', { maximumFractionDigits: 2 });\n    const naira = (n) => '₦' + n2(n);\n    const short = (n) => n >= 1e9 ? '₦' + (n / 1e9).toFixed(2) + 'bn' : '₦' + (n / 1e6).toFixed(1) + 'm';\n    const TT = { PC: 'Prime cost sum: an allowance for a specialist item chosen later', PS: 'Provisional sum: money for work not yet defined' };\n    const B = [\n      ['A', 'Substructure', [['Excavate to receive ground beams', 64, 'm³', 6500], ['Reinforced concrete raft', 83, 'm³', 185000], ['Reinforced concrete ground beams', 85, 'm³', 185000], ['Bar reinforcement', 26.89, 't', 1450000], ['Additional works', 1, 'item', 1000000, 'PS']]],\n      ['B', 'Frame', [['Columns', 30, 'm³', 200000], ['Beams', 53, 'm³', 190000], ['Bar reinforcement', 21.84, 't', 1450000]]],\n      ['C', 'Upper floors', [['Suspended slab', 147, 'm³', 190000], ['Bar reinforcement', 17.64, 't', 1450000]]],\n      ['D', 'Roof', [['Longspan aluminium sheet', 205, 'm²', 16500], ['Waterproofing', 126, 'm²', 14000], ['Steel roof framing', 1, 'item', 4000000, 'PC']]],\n      ['H', 'Windows and doors', [['Aluminium windows and doors', 1, 'item', 64000000, 'PC'], ['Security doors', 1, 'item', 51000000, 'PC']]],\n      ['M', 'Floor finishes', [['Vitrified floor tiles', 1005, 'm²', 58000], ['Marble floor slab', 17, 'm²', 95000]]],\n      ['Q', 'Fittings', [['Kitchen cabinets and equipment', 1, 'item', 100000000, 'PC'], ['Wardrobes and closets', 1, 'item', 30000000, 'PC']]]\n    ];\n    const els = B.map(([code, name, rows]) => {\n      const rr = rows.map(([d, q, u, rate, tag]) => ({ d, q: n0(q), u, rate: tag ? 'sum' : n0(rate), amt: n2(q * rate), val: q * rate, tag: tag || '', tagTitle: TT[tag] || '', tagBg: tag === 'PC' ? '#F6C9A3' : '#D5DDE5' }));\n      return { code, name, rows: rr, total: rr.reduce((a, r) => a + r.val, 0) };\n    });\n    const elements = els.map((e) => { const open = e.code === S.el; return { ...e, open, short: short(e.total), expanded: open ? 'true' : 'false', pick: () => this.setState({ el: open ? null : e.code }) }; });\n    const bill2 = naira(els.reduce((a, e) => a + e.total, 0));\n    const sv = [250e6, 500e6, 1e9], C = sv[S.sum];\n    const pct = [2, 3, 5, 8, 11, 13, 14, 13, 11, 9, 7, 4];\n    const full = ['March 2026', 'April 2026', 'May 2026', 'June 2026', 'July 2026', 'August 2026', 'September 2026', 'October 2026', 'November 2026', 'December 2026', 'January 2027', 'February 2027'];\n    let c = 0; const cum = pct.map((p) => (c += p));\n    const pt = (i) => ((i + 0.5) * 100) + ',' + (290 - cum[i] * 2.7).toFixed(1);\n    const m = S.month, gross = C * pct[m] / 100, ret = gross * 0.05, last = m === 11, moiety = last ? C * 0.025 : 0;\n    const net = gross - ret + moiety, vat = net * 0.075;\n    const lines = [{ k: 'Value of work this month', v: n2(gross) }, { k: 'Less retention at 5%', v: '(' + n2(ret) + ')' }];\n    if (last) lines.push({ k: 'Add half the retention', v: n2(moiety) });\n    lines.push({ k: 'VAT at 7.5%', v: n2(vat) });\n    const cur = { full: full[m], cumPct: cum[m] + '%', lines: lines.map((l) => ({ ...l, w: 400 })).concat([{ k: 'Due to the contractor', v: naira(net + vat), w: 600 }]),\n      note: last ? 'Half the retention is released at practical completion.' : (m \u003c 8 && m > 2 ? 'Peak spending: frame, roof and envelope at once.' : 'Spending is lighter at the start and the finish.') };\n    const work = C * S.work / 100, retain = work * 0.05, rel = S.pc ? retain / 2 : 0, prev = C * Math.max(0, S.work - 9) / 100 * 0.95;\n    const vnet = work - retain + rel - prev, vv = Math.max(0, vnet) * 0.075;\n    const vl = [{ k: 'Work done to date', v: n2(work) }, { k: 'Less retention at 5%', v: '(' + n2(retain) + ')' }];\n    if (S.pc) vl.push({ k: 'Add retention released', v: n2(rel) });\n    vl.push({ k: 'Less previous certificates', v: '(' + n2(prev) + ')' }, { k: 'VAT at 7.5%', v: n2(vv) });\n    const T = ['Bill of Quantities', 'Cash flow', 'Payment'];\n\n    const PR = [['Preliminaries', 0, 11], ['A Substructure', 0, 2], ['B Frame', 3, 6], ['C Upper floors', 3, 6], ['E Staircases', 5, 6], ['D Roof', 6, 8], ['F External walls', 6, 11], ['G Internal walls', 6, 8], ['H Windows and external doors', 6, 9], ['J Internal doors', 6, 9], ['K Plumbing and mechanical', 3, 10], ['L Electrical', 3, 9], ['N Wall finishes', 7, 8], ['M Floor finishes', 9, 10], ['Q Fittings and furnishing', 9, 10], ['Lift and sanitaryware ordered', 5, 5], ['External works, gatehouse and pool', 8, 9], ['Lighting and electrical accessories', 10, 11], ['Planting', 11, 11]];\n    const MOH = ['M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D', 'J', 'F'];\n    const progRows = PR.map(([n, a, b]) => ({ n, cells: MOH.map((_, k) => ({ bg: k >= a && k \u003c= b ? (k === S.month ? '#E8731C' : '#D9B48F') : (k === S.month ? '#F1EEE7' : 'transparent') })) }));\n    const onSite = PR.filter(([n, a, b]) => S.month >= a && S.month \u003c= b).map(([n]) => n.replace(/^[A-Z] /, ''));\n    return {\n      progRows, moh: MOH, onSite: onSite.map((n) => ({ n })), onSiteCount: onSite.length,\n      tabs: T.map((l, i) => ({ label: l, selected: i === S.tab ? 'true' : 'false', bg: i === S.tab ? '#1D2023' : 'transparent', fg: i === S.tab ? '#F5F6F4' : '#1D2023', pick: () => this.setState({ tab: i }) })),\n      isBoq: S.tab === 0, isCash: S.tab === 1, isVal: S.tab === 2,\n      elements, bill2,\n      sums: sv.map((v, i) => ({ label: short(v), pressed: i === S.sum ? 'true' : 'false', bg: i === S.sum ? '#E8731C' : 'transparent', pick: () => this.setState({ sum: i }) })),\n      months: pct.map((p, i) => ({ h: (p / 14 * 72).toFixed(1) + '%', bg: i === m ? '#E8731C' : (i \u003c m ? '#C8B49C' : '#E6E9EB'), pressed: i === m ? 'true' : 'false', aria: full[i] + ': ' + p + '%', pick: () => this.setState({ month: i }) })),\n      planPts: '0,290 ' + pct.map((_, i) => pt(i)).join(' '), actPts: '0,290 ' + pct.slice(0, m + 1).map((_, i) => pt(i)).join(' '),\n      month: m, setMonth: (e) => this.setState({ month: Number(e.target.value) }), cur,\n      val: { work: S.work, workPct: S.work + '%', no: Math.max(1, Math.round(S.work / 12)), lines: vl.map((l) => ({ w: 400, ...l })), due: naira(Math.max(0, vnet + vv)) },\n      setWork: (e) => this.setState({ work: Number(e.target.value) }), pc: S.pc, togglePc: () => this.setState({ pc: !S.pc })\n    };\n  }\n}\n","props":{"$preview":{"width":390,"height":2600}}}},"comps":{"R2-J77A-Model":{"name":"R2-J77A-Model","tree":[" ",["div",{"style":"font-family: 'Archivo', sans-serif; font-size: 16px; line-height: 1.5; color: #F2EEE7; background: #16181A; border: 1px solid #3A3D40"},[" ",["div",{"style":"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #3A3D40"},[" ",["div",{"role":"group","aria-label":"Model view","style":"display: flex; border
