ems: [\n        { d: 'Stepped longspan aluminium sheet', q: '205 m²' },\n        { d: 'Liquid-applied waterproofing', q: '126 m²' } ] },\n      { code: 'F', name: 'Walls', amount: 27500000, items: [\n        { d: '230mm sandcrete blockwork, external', q: '765 m²' },\n        { d: '230mm sandcrete blockwork, internal', q: '1,291 m²' } ] },\n      { code: 'H', name: 'Windows & external doors', amount: 128600000, items: [\n        { d: 'Powder-coated aluminium windows & doors', q: 'PC sum' },\n        { d: 'Security doors', q: 'PC sum' } ] }\n    ];\n    const total = els.reduce((a, e) => a + e.amount, 0);\n    const elements = els.map((e) => {\n      const open = this.state.open === e.code;\n      return { ...e, open, expanded: open ? 'true' : 'false', sign: open ? '−' : '+', bg: open ? '#F1EEE7' : 'transparent',\n        amountFmt: fmt(e.amount), toggle: () => this.setState({ open: open ? null : e.code }) };\n    });\n    const stages = [\n      { n: '01', phase: 'FEASIBILITY', q: 'Is it worth building?', services: ['Feasibility studies'],\n        body: 'Before you commit, we test the numbers: land, construction cost, market conditions and financing, set against what the finished building can earn or be worth.',\n        docs: ['Feasibility report', 'Development appraisal'], cap: 'Fig. 1 — Plot survey and site appraisal' },\n      { n: '02', phase: 'DESIGN', q: 'What will it cost?', services: ['Cost planning'],\n        body: 'As the architect draws, we price. An elemental cost plan keeps the design and the budget moving together, so there are no surprises at tender.',\n        docs: ['Elemental cost plan', 'Cost checks at each design stage'], cap: 'Fig. 2 — Massing, area and rate per m²' },\n      { n: '03', phase: 'TENDER', q: 'Who builds it, and on what terms?', services: ['Contract documentation'],\n        body: 'We measure every item in the drawings into a Bill of Quantities, run the tender, compare bids line by line and prepare the contract.',\n        docs: ['Bills of Quantities', 'Tender report', 'Contract documents (JCT)'], cap: 'Fig. 3 — Bill No. 2, carried to collection' },\n      { n: '04', phase: 'CONSTRUCTION', q: 'Is the money under control?', services: ['Cost control'],\n        body: 'Each month we measure work done on site, value it, and certify what the contractor is owed — less retention. Variations are priced before they are built.',\n        docs: ['Cash flow projection', 'Monthly interim valuations', 'Cost reports'], cap: 'Fig. 4 — Frame complete, Valuation No. 5' },\n      { n: '05', phase: 'COMPLETION', q: \"What's the final bill?\", services: ['Valuation', 'Final account'],\n        body: 'At practical completion half the retention is released. After the defects period we agree the final account and close the books.',\n        docs: ['Penultimate & final valuation', 'Final account', 'Retention release'], cap: 'Fig. 5 — Handover, defects period begins' },\n      { n: '06', phase: 'IF NEEDED', q: 'What if we disagree?', services: ['Arbitration'],\n        body: 'When claims arise, we assess them on the record — measurements, valuations and instructions — and help settle them fairly without stopping the job.',\n        docs: ['Claims assessment', 'Expert report'], cap: 'Fig. 6 — Claims weighed on the record' }\n    ].map((s, i) => ({ ...s, dot: i \u003c 4 ? '#E8731C' : '#FBFAF7', is1: i === 0, is2: i === 1, is3: i === 2, is4: i === 3, is5: i === 4, is6: i === 5 }));\n    const side = [\n      { name: 'Kings Tower', meta: 'Offices · Ikoyi, Lagos' },\n      { name: 'Civil Service Hospital', meta: 'Healthcare · Ilorin, Kwara' }\n    ];\n    return { elements, total: '₦' + fmt(total), stages, side };\n  }\n}\n","props":{"$preview":{"width":1440,"height":4700}}},"mobile":{"name":"Home-Mobile","tree":[" ",["div",{"style":"font-family: 'IBM Plex Sans', sans-serif; color: #1B1C1E; background: #F3F2EE; min-height: 100%"},[" ",["header",{"style":"display: flex; align-items: center; justify-content: space-between; class Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { mode: 'build', stage: 7, scrub: 80, playing: false, level: 3, load: 0, status: 'loading' };\n    this.viewer = null; this.canvas = null; this.timer = null; this.io = null; this.started = false;\n    this.setCanvas = (el) => { if (el && el !== this.canvas) { this.canvas = el; this.boot(); } };\n  }\n  core() {\n    // J77A model viewer core — raw WebGL2, no libraries.\n// makeViewer(canvas, header, arrays, opts) -> controller\nfunction makeViewer(canvas, data, opts) {\n  opts = opts || {};\n  var gl = canvas.getContext('webgl2', { antialias: true, alpha: false, preserveDrawingBuffer: !!opts.preserve });\n  if (!gl) return null;\n  var H = data.header;\n  var bmin = H.bboxMin, bmax = H.bboxMax;\n  var span = [bmax[0] - bmin[0], bmax[1] - bmin[1], bmax[2] - bmin[2]];\n  var bg = opts.bg || [0.071, 0.075, 0.078];\n  var accent = opts.accent || [0.94, 0.5, 0.165];\n\n  function sh(type, src) {\n    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);\n    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));\n    return s;\n  }\n  function prog(vs, fs) {\n    var p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));\n    gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));\n    return p;\n  }\n  var VS = '#version 300 es\\n' +\n    'in vec3 aPos; in vec4 aCol; uniform mat4 uMVP; uniform vec3 uMin; uniform vec3 uSpan;\\n' +\n    'out vec3 vW; out vec3 vCol; flat out float vStage;\\n' +\n    'void main(){ vec3 w = uMin + aPos * uSpan; vW = w; vCol = aCol.rgb / 255.0; vStage = aCol.a; gl_Position = uMVP * vec4(w, 1.0); }';\n  var FS = '#version 300 es\\nprecision highp float;\\n' +\n    'in vec3 vW; in vec3 vCol; flat in float vStage; out vec4 o;\\n' +\n    'uniform float uProg; uniform vec2 uZ[8]; uniform float uClip; uniform vec3 uSun; uniform float uMode; uniform float uAlpha; uniform vec3 uAccent; uniform vec3 uEye; uniform vec3 uBg; uniform vec3 uGhost;\\n' +\n    'void main(){\\n' +\n    ' if (vW.z > uClip) discard;\\n' +\n    ' float cur = floor(uProg); float f = uProg - cur; int ci = int(min(cur, 7.0));\\n' +\n    ' float cut = mix(uZ[ci].x - 0.05, uZ[ci].y + 0.05, smoothstep(0.0, 1.0, f));\\n' +\n    ' bool built = vStage \u003c cur || (vStage == cur && vW.z \u003c= cut);\\n' +\n    ' if (uMode \u003c 0.5) { if (!built) discard; } else { if (built) discard; }\\n' +\n    ' vec3 n = normalize(cross(dFdx(vW), dFdy(vW)));\\n' +\n    ' if (uMode > 0.5) { float e = 1.0 - abs(dot(n, normalize(uEye - vW))); o = vec4(uGhost, 0.012 + 0.07 * e * e * e); return; }\\n' +\n    ' float d = abs(dot(n, uSun)); float up = 0.5 + 0.5 * n.z;\\n' +\n    ' vec3 c = vCol * (0.42 + 0.50 * d) + vCol * vec3(0.05, 0.07, 0.10) * up;\\n' +\n    ' if (vStage == cur && uProg \u003c 8.0) { float front = 1.0 - smoothstep(0.0, 0.9, cut - vW.z); c = mix(c, uAccent, 0.14 + 0.6 * front); }\\n' +\n    ' float dist = length(uEye - vW); c = mix(c, uBg, clamp((dist - 60.0) / 160.0, 0.0, 0.5));\\n' +\n    ' o = vec4(c, uAlpha);\\n' +\n    '}';\n  var GVS = '#version 300 es\\nin vec2 aP; uniform mat4 uMVP; uniform float uZg; uniform vec4 uR; out vec2 vP;\\n' +\n    'void main(){ vec2 p = mix(uR.xy, uR.zw, aP); vP = p; gl_Position = uMVP * vec4(p, uZg, 1.0); }';\n  var GFS = '#version 300 es\\nprecision highp float; in vec2 vP; out vec4 o; uniform vec3 uBg; uniform vec3 uLine; uniform vec2 uC; uniform float uRad;\\n' +\n    'float g(float s){ vec2 q = abs(fract(vP / s - 0.5) - 0.5) / fwidth(vP / s); return 1.0 - min(min(q.x, q.y), 1.0); }\\n' +\n    'void main(){ float r = length(vP - uC) / uRad; float fade = 1.0 - smoothstep(0.35, 1.0, r);\\n' +\n    ' float l = max(g(1.0) * 0.35, g(5.0)); vec3 c = mix(uBg, uLine, l * 0.5 * fade); o = vec4(c, 1.0); }';\n  var P = prog(VS, FS), G = prog(GVS, GFS);\n  var U = {}; ['uMVP', 'uMin', 'uSpan', 'uProg', 'uClip', 'uSun', 'uMode', 'uAlpha', 'uAccent', 'uEye', 'uBg', 'uGhost'].forEach(function (k) { U[k] = gl.getUniformLocation(P, k); });\n  var uZ = gl.getUniformLocation(P, 'uZ');\n  var UG = {}; ['uMVP', 'uZg', 'uR', 'uBg', 'uLine', 'uC', 'uRad'].forEach(function (k) { UG[k] = gl.getUniformLocation(G, k); });\n\n  var chunks = data.chunks.map(function (c) {\n    var vao = gl.createVertexArray(); gl.bindVertexArray(vao);\n    var pb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pb); gl.bufferData(gl.ARRAY_BUFFER, c.pos, gl.STATIC_DRAW);\n    var la = gl.getAttribLocation(P, 'aPos'); gl.enableVertexAttribArray(la); gl.vertexAttribPointer(la, 3, gl.UNSIGNED_SHORT, true, 0, 0);\n    var cb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cb); gl.bufferData(gl.ARRAY_BUFFER, c.col, gl.STATIC_DRAW);\n    var lc = gl.getAttribLocation(P, 'aCol'); gl.enableVertexAttribArray(lc); gl.vertexAttribPointer(lc, 4, gl.UNSIGNED_BYTE, false, 0, 0);\n    var ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, c.idx, gl.STATIC_DRAW);\n    gl.bindVertexArray(null);\n    return { vao: vao, n: c.idx.length, meta: c.meta };\n  });\n  var gvao = gl.createVertexArray(); gl.bindVertexArray(gvao);\n  var gb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, gb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);\n  var lg = gl.getAttribLocation(G, 'aP'); gl.enableVertexAttribArray(lg); gl.vertexAttribPointer(lg, 2, gl.FLOAT, false, 0, 0);\n  gl.bindVertexArray(null);\n\n  // camera\n  var focus = opts.focus || [3, -1, 5.5];\n  var cam = { az: opts.az != null ? opts.az : -0.9, el: opts.el != null ? opts.el : 0.42, dist: opts.dist || 80, fov: 0.62 };\n  var state = { prog: opts.prog != null ? opts.prog : 8, target: opts.prog != null ? opts.prog : 8, clip: 1e4, clipT: 1e4, auto: opts.auto !== false, dragging: false, lastInteract: 0, raf: 0, alive: true, ghost: opts.ghost !== false };\n  var stageZ = new Float32Array(16); for (var i = 0; i \u003c 8; i++) { stageZ[i * 2] = H.stageZ[i][0]; stageZ[i * 2 + 1] = H.stageZ[i][1]; }\n\n  function persp(fy, a, n, f) { var t = 1 / Math.tan(fy / 2); return [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0]; }\n  function look(e, c, u) {\n    var z = norm([e[0] - c[0], e[1] - c[1], e[2] - c[2]]), x = norm(cross(u, z)), y = cross(z, x);\n    return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1];\n  }\n  function mul(a, b) { var r = new Array(16); for (var c = 0; c \u003c 4; c++) for (var rr = 0; rr \u003c 4; rr++) { var s = 0; for (var k = 0; k \u003c 4; k++) s += a[k * 4 + rr] * b[c * 4 + k]; r[c * 4 + rr] = s; } return r; }\n  function norm(v) { var l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }\n  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }\n  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }\n\n  function resize() {\n    var dpr = Math.min(window.devicePixelRatio || 1, 2);\n    var w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));\n    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }\n  }\n  var sun = norm([0.45, -0.55, 0.7]);\n  function draw() {\n    resize();\n    gl.viewport(0, 0, canvas.width, canvas.height);\n    gl.clearColor(bg[0], bg[1], bg[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);\n    var eye = [focus[0] + cam.dist * Math.cos(cam.el) * Math.cos(cam.az), focus[1] + cam.dist * Math.cos(cam.el) * Math.sin(cam.az), focus[2] + cam.dist * Math.sin(cam.el)];\n    var mvp = mul(persp(cam.fov, canvas.width / canvas.height, 0.5, 600), look(eye, focus, [0, 0, 1]));\n    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(g
