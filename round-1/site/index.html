d beams', q: '64 m³' }, { d: 'Reinforced concrete raft', q: '83 m³' }, { d: 'Bar reinforcement', q: '26.89 t' }, { d: 'Damp-proof membrane', q: '417 m²' }] },\n      { code: 'B', name: 'Frame', amount: 41200000, items: [{ d: 'Concrete columns', q: '30 m³' }, { d: 'Beams', q: '53 m³' }, { d: 'Bar reinforcement', q: '21.84 t' }] },\n      { code: 'C', name: 'Upper floors', amount: 33700000, items: [{ d: 'Suspended slab', q: '147 m³' }, { d: 'Soffit formwork', q: '980 m²' }] },\n      { code: 'D', name: 'Roof', amount: 22900000, items: [{ d: 'Long-span aluminium roofing', q: '205 m²' }, { d: 'Liquid waterproofing', q: '126 m²' }] },\n      { code: 'F', name: 'External walls', amount: 27500000, items: [{ d: '230 mm sandcrete blockwork', q: '765 m²' }, { d: '150 mm sandcrete blockwork', q: '16 m²' }] },\n      { code: 'H', name: 'Windows and doors', amount: 128600000, items: [{ d: 'Aluminium windows and doors', q: 'PC sum' }, { d: 'Security doors', q: 'PC sum' }] }\n    ];\n    const total = els.reduce((a, e) => a + e.amount, 0);\n    const elements = els.map((e) => { const open = this.state.open === e.code; return { ...e, open, expanded: open ? 'true' : 'false', sign: open ? '−' : '+', amountFmt: fmt(e.amount), toggle: () => this.setState({ open: open ? null : e.code }) }; });\n    const stages = [\n      { n: '1', q: 'Is it worth building?', service: 'Feasibility studies', body: 'Before you commit to land or design fees, we test the numbers: the site, what you want to build, what it will cost, how it will be paid for and what it will be worth when it is finished.', docs: ['Feasibility report', 'Development appraisal'] },\n      { n: '2', q: 'What will it cost?', service: 'Cost planning', body: 'We price the design while the architect draws it. An elemental cost plan, checked at every design stage, keeps the drawings and the budget in step, so the tender holds no surprises.', docs: ['Elemental cost plan', 'Cost checks at each design stage'] },\n      { n: '3', q: 'Who builds it, and on what terms?', service: 'Contract documentation', body: 'We measure every item on the drawings into a Bill of Quantities, so every contractor prices exactly the same work. Then we run the tender, compare the bids line by line and draw up the contract.', docs: ['Bills of Quantities', 'Tender report and recommendation', 'Contract documents'] },\n      { n: '4', q: 'Is the money under control?', service: 'Cost control', body: 'Every month we measure the work done on site, value it and certify what the contractor is owed, less retention. We price variations before they are built and report the forecast final cost while there is still time to act.', docs: ['Cash flow forecast', 'Monthly valuations and payment certificates', 'Cost reports'] },\n      { n: '5', q: 'What is the final bill?', service: 'Valuation and final account', body: 'At practical completion half the retention is released. When the defects period ends, we agree the final account with the contractor and close the books.', docs: ['Final valuation', 'Final account', 'Release of retention'] },\n      { n: '6', q: 'What if we disagree?', service: 'Arbitration', body: 'If a claim arises, we assess it against the record: measurements, certificates and instructions. The aim is a fair settlement that keeps the job moving.', docs: ['Claims assessment', 'Expert report'] }\n    ].map((s, i) => ({ ...s, is1: i === 0, is2: i === 1, is3: i === 2, is4: i === 3, is5: i === 4, is6: i === 5 }));\n    return { elements, total: fmt(total), stages };\n  }\n}\n","props":{"$preview":{"width":1440,"height":6200}}},"mobile":null},"comps":{"J77A-Model":{"name":"J77A-Model","tree":[" ",["div",{"class":"mdl"},[" ",["div",{"class":"mdl-bar"},[" ",["div",{"class":"mdl-seg","role":"group","aria-label":"Model view"},[["button",{"type":"button","onClick":"{{toBuild}}","aria-pressed":"{{buildPressed}}"},["The build"]],["button",{"type":"button","onClick":"{{toFloors}}","aria-pressed":"{{floorsPressed}}"},["Floor by floor"]
