tProgramInfoLog(p));\n    return p;\n  }\n  var VS = '#version 300 es\\n' +\n    'in vec3 aPos; in vec4 aCol; uniform mat4 uMVP; uniform vec3 uMin; uniform vec3 uSpan;\\n' +\n    'out vec3 vW; out vec3 vCol; flat out float vStage;\\n' +\n    'void main(){ vec3 w = uMin + aPos * uSpan; vW = w; vCol = aCol.rgb / 255.0; vStage = aCol.a; gl_Position = uMVP * vec4(w, 1.0); }';\n  var FS = '#version 300 es\\nprecision highp float;\\n' +\n    'in vec3 vW; in vec3 vCol; flat in float vStage; out vec4 o;\\n' +\n    'uniform float uProg; uniform vec2 uZ[8]; uniform float uClip; uniform vec3 uSun; uniform float uMode; uniform float uAlpha; uniform vec3 uAccent; uniform vec3 uEye; uniform vec3 uBg; uniform vec3 uGhost;\\n' +\n    'void main(){\\n' +\n    ' if (vW.z > uClip) discard;\\n' +\n    ' float cur = floor(uProg); float f = uProg - cur; int ci = int(min(cur, 7.0));\\n' +\n    ' float cut = mix(uZ[ci].x - 0.05, uZ[ci].y + 0.05, smoothstep(0.0, 1.0, f));\\n' +\n    ' bool built = vStage \u003c cur || (vStage == cur && vW.z \u003c= cut);\\n' +\n    ' if (uMode \u003c 0.5) { if (!built) discard; } else { if (built) discard; }\\n' +\n    ' vec3 n = normalize(cross(dFdx(vW), dFdy(vW)));\\n' +\n    ' if (uMode > 0.5) { float e = 1.0 - abs(dot(n, normalize(uEye - vW))); o = vec4(uGhost, 0.012 + 0.07 * e * e * e); return; }\\n' +\n    ' float d = abs(dot(n, uSun)); float up = 0.5 + 0.5 * n.z;\\n' +\n    ' vec3 c = vCol * (0.42 + 0.50 * d) + vCol * vec3(0.05, 0.07, 0.10) * up;\\n' +\n    ' if (vStage == cur && uProg \u003c 8.0) { float front = 1.0 - smoothstep(0.0, 0.9, cut - vW.z); c = mix(c, uAccent, 0.14 + 0.6 * front); }\\n' +\n    ' float dist = length(uEye - vW); c = mix(c, uBg, clamp((dist - 60.0) / 160.0, 0.0, 0.5));\\n' +\n    ' o = vec4(c, uAlpha);\\n' +\n    '}';\n  var GVS = '#version 300 es\\nin vec2 aP; uniform mat4 uMVP; uniform float uZg; uniform vec4 uR; out vec2 vP;\\n' +\n    'void main(){ vec2 p = mix(uR.xy, uR.zw, aP); vP = p; gl_Position = uMVP * vec4(p, uZg,
