h:100%;accent-color:var(--amber);min-height:32px}\n\n"],"links":["https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"],"script":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { tab: 0, el: 'A', sum: 1, month: 6, mob: true, work: 62, mat: 1, pc: false };\n  }\n  renderVals() {\n    const S = this.state;\n    const n2 = (n) => n.toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n    const n0 = (n) => n.toLocaleString('en-NG', { maximumFractionDigits: 2 });\n    const naira = (n) => '₦' + n2(n);\n    const short = (n) => n >= 1e9 ? '₦' + (n / 1e9).toFixed(2) + 'bn' : '₦' + (n / 1e6).toFixed(1) + 'm';\n\n    // ---------- BoQ (illustrative rates) ----------\n    const B = [\n      ['A', 'Substructure', [['Excavate to receive ground beams', 64, 'm³', 6500], ['Fine sand filling, imported', 350, 'm³', 14000], ['Hardcore filling, granite', 63, 'm³', 28000], ['Reinforced concrete ground beams', 85, 'm³', 185000], ['Reinforced concrete raft', 83, 'm³', 185000], ['Bar reinforcement 10–25mm', 26.89, 't', 1450000], ['Formwork to ground beams', 685, 'm²', 9500], ['Polythene damp-proof membrane', 417, 'm²', 1800], ['Additional works in substructure', 1, 'item', 1000000, 'PS']]],\n      ['B', 'Frame', [['Reinforced concrete lift walls', 23, 'm³', 190000], ['Beams, isolated or attached', 53, 'm³', 190000], ['Columns, 35N/mm²', 30, 'm³', 200000], ['Bar reinforcement 8–25mm', 21.84, 't', 1450000], ['Formwork to beams', 440, 'm²', 11000], ['Formwork to columns', 411, 'm²', 11000]]],\n      ['C', 'Upper floors', [['Suspended solid slab', 147, 'm³', 190000], ['Bar reinforcement', 17.64, 't', 1450000], ['Soffit formwork', 980, 'm²', 11000]]],\n      ['D', 'Roof', [['Roof beams and slab', 16, 'm³', 190000], ['Bar reinforcement', 2.6, 't', 1450000], ['Polyurethane waterproofing', 126, 'm²', 14000], ['Stepped longspan aluminium sheet', 205, 'm²', 16500], ['Galvanised steel roof framing', 1, 'item', 4000000, 'PC']]],\n      ['E', 'Staircases', [['Reinforced concrete stairs', 8, 'm³', 195000], ['Bar reinforcement', 0.96, 't', 1450000], ['Ceramic floor tiles to stairs', 13, 'm²', 55000], ['Toughened glass terrace handrail', 1, 'item', 3200000, 'PC']]],\n      ['F', 'External walls', [['230mm sandcrete blockwork', 765, 'm²', 24000], ['150mm sandcrete blockwork', 16, 'm²', 18000], ['100mm sandcrete blockwork', 43, 'm²', 15000]]],\n      ['G', 'Internal walls', [['230mm sandcrete blockwork', 1291, 'm²', 24000], ['150mm sandcrete blockwork', 179, 'm²', 18000], ['100mm sandcrete blockwork', 85, 'm²', 15000]]],\n      ['H', 'Windows and external doors', [['Powder-coated aluminium windows and doors', 1, 'item', 64000000, 'PC'], ['Security doors', 1, 'item', 51000000, 'PC'], ['Automated roller shutter door', 1, 'item', 5000000, 'PC'], ['Reinforced concrete lintels and hoods', 21, 'm³', 185000]]],\n      ['J', 'Internal doors', [['Timber flush doors and ironmongery', 1, 'item', 56000000, 'PC'], ['Hardwood door subframes', 30, 'nr', 85000], ['Install doors complete', 30, 'nr', 45000]]],\n      ['M', 'Floor finishes', [['Vitrified floor tiles 1000×1000', 1005, 'm²', 58000], ['Marble floor slab', 17, 'm²', 95000], ['30mm cement & sand screed', 1075, 'm²', 4500], ['Cementitious waterproofing, wet areas', 213, 'm²', 9000]]],\n      ['N', 'Wall finishes', [['Internal render, 12mm', 3419, 'm²', 3800], ['POP screeding', 3419, 'm²', 2500], ['Glazed wall tiles', 685, 'm²', 52000], ['Porcelain external cladding', 823, 'm²', 62000], ['Emulsion paint, 3 coats', 3419, 'm²', 2200]]],\n      ['P', 'Ceiling finishes', [['Suspended plasterboard ceiling', 904, 'm²', 14500], ['Moisture-resistant board, wet areas', 188, 'm²', 17500], ['Emulsion to ceilings', 1092, 'm²', 2000], ['Undefined ceiling works', 1, 'item', 2000000, 'PS']]],\n      ['Q', 'Fittings and furnishing', [['Shelving, closets and wardrobes', 1, 'item', 30000000, 'PC'], ['Kitchen cabinets and equipment', 1, 'item', 100000000, 'PC'], ['Granite vanity tops', 20, 'm', 75000]]]\n    ];\n    const els = B.map(([code, name, rows]) => {\n      const rr = rows.map(([d, q, u, rate, tag]) => ({ d, q: n0(q), u, rate: tag ? '' : n0(rate), amt: n2(q * rate), val: q * rate, isPC: tag === 'PC', isPS: tag === 'PS' }));\n      return { code, name, rows: rr, total: rr.reduce((a, r) => a + r.val, 0) };\n    });\n    const bill2 = els.reduce((a, e) => a + e.total, 0);\n    const elements = els.map((e) => ({ code: e.code, name: e.name, short: short(e.total), pressed: e.code === S.el ? 'true' : 'false',\n      pick: () => this.setState({ el: e.code }) }));\n    const selE = els.find((e) => e.code === S.el) || els[0];\n    const sel = { ...selE, totalFmt: naira(selE.total) };\n    const bill3 = 68500000, bill4 = 212000000, cont = 30000000;\n    const bill1 = Math.round((bill2 + bill3 + bill4) * 0.06);\n    const sub = bill1 + bill2 + bill3 + bill4 + cont;\n    const vat = sub * 0.075;\n    const summary = [\n      { k: 'Bill No. 1: Preliminaries', v: n2(bill1) }, { k: 'Bill No. 2: Main building', v: n2(bill2) },\n      { k: 'Bill No. 3: External works', v: n2(bill3) }, { k: 'Bill No. 4: Mechanical and electrical', v: n2(bill4) },\n      { k: 'Contingency', v: n2(cont) }, { k: 'Add VAT 7.5%', v: n2(vat) }\n    ].map((s) => ({ ...s, cls: 'kv' })).concat([{ k: 'Tender sum', v: naira(sub + vat), cls: 'kv b' }]);\n\n    // ---------- Cash flow ----------\n    const sumsVals = [250e6, 500e6, 1e9];\n    const C = sumsVals[S.sum];\n    const pct = [2, 3, 5, 8, 11, 13, 14, 13, 11, 9, 7, 4];\n    const labels = ['Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb'];\n    const fullLabels = ['March 2026', 'April 2026', 'May 2026', 'June 2026', 'July 2026', 'August 2026', 'September 2026', 'October 2026', 'November 2026', 'December 2026', 'January 2027', 'February 2027'];\n    const maxP = 14;\n    let cum = 0; const cumArr = pct.map((p) => (cum += p));\n    const pt = (i) => ((i + 0.5) * 100).toFixed(0) + ',' + (290 - cumArr[i] * 2.7).toFixed(1);\n    const planPts = '0,290 ' + pct.map((_, i) => pt(i)).join(' ');\n    const actPts = '0,290 ' + pct.slice(0, S.month + 1).map((_, i) => pt(i)).join(' ');\n    const months = pct.map((p, i) => ({ label: labels[i], h: (p / maxP * 72).toFixed(1) + '%',\n      bg: i === S.month ? '#E69600' : (i \u003c S.month ? '#F3CF8A' : '#E6E6E9'), pressed: i === S.month ? 'true' : 'false',\n      aria: fullLabels[i] + ', ' + p + '% of the contract', pick: () => this.setState({ month: i }) }));\n    const m = S.month, gross = C * pct[m] / 100, ret = gross * 0.05;\n    const mobRec = S.mob ? gross * 0.15 : 0;\n    const last = m === 11, moiety = last ? C * 0.025 : 0;\n    const net = gross - ret - mobRec + moiety, mvat = net * 0.075;\n    const lines = [\n      { k: 'Gross value of work this month', v: n2(gross) },\n      { k: 'Less retention 5%', v: '(' + n2(ret) + ')' }\n    ];\n    if (S.mob) lines.push({ k: 'Less mobilisation recovered (15%)', v: '(' + n2(mobRec) + ')' });\n    if (last) lines.push({ k: 'Add release of moiety 2.5%', v: n2(moiety) });\n    lines.push({ k: 'Add VAT 7.5%', v: n2(mvat) });\n    const cur = { full: fullLabels[m], label: labels[m], cumPct: cumArr[m] + '%', cumAmt: short(C * cumArr[m] / 100),\n      lines: lines.map((l) => ({ ...l, cls: 'kv' })).concat([{ k: 'Amount due to the contractor', v: naira(net + mvat), cls: 'kv b' }]),\n      note: last ? 'Practical completion: half of the retention held so far (the \"moiety\", 2.5% of the contract) is released to the contractor this month.'\n        : (m \u003c 3 ? 'The early months are light: setting up the site and the substructure. Spending picks up as the frame goes up.' : (m \u003c 8 ? 'Peak spending: the frame, roof and walls are all moving at once. This is where cost control matters most.' : 'Spending tapers off into finishes and services. Retention keeps ttings and furnishing', 9, 10], ['Lift and sanitaryware ordered', 5, 5], ['External works, gatehouse and pool', 8, 9], ['Lighting and electrical accessories', 10, 11], ['Planting', 11, 11]];\n    const MOH = ['M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D', 'J', 'F'];\n    const progRows = PR.map(([n, a, b]) => ({ n, cells: MOH.map((_, k) => ({ bg: k >= a && k \u003c= b ? (k === S.month ? '#E69600' : '#F3CF8A') : (k === S.month ? '#FFF7E6' : 'transparent') })) }));\n    const onSite = PR.filter(([n, a, b]) => S.month >= a && S.month \u003c= b).map(([n]) => n.replace(/^[A-Z] /, ''));\n    return {\n      progRows, moh: MOH, onSite: onSite.map((n) => ({ n })), onSiteCount: onSite.length,\n      tabs, tabId: 'tab-' + S.tab, isBoq: S.tab === 0, isCash: S.tab === 1, isVal: S.tab === 2, explain: EX[S.tab],\n      elements, sel, summary,\n      sums, sumFmt: short(C), mob: S.mob, toggleMob: () => this.setState({ mob: !S.mob }),\n      months, planPts, actPts, cur,\n      val, mats, setWork: (e) => this.setState({ work: Number(e.target.value) }),\n      pc: S.pc, togglePc: () => this.setState({ pc: !S.pc })\n    };\n  }\n}\n","props":{"$preview":{"width":1440,"height":2300}}},"mobile":null},"comps":{"J77A-Model":{"name":"J77A-Model","tree":[" ",["div",{"class":"mdl"},[" ",["div",{"class":"mdl-bar"},[" ",["div",{"class":"mdl-seg","role":"group","aria-label":"Model view"},[["button",{"type":"button","onClick":"{{toBuild}}","aria-pressed":"{{buildPressed}}"},["The build"]],["button",{"type":"button","onClick":"{{toFloors}}","aria-pressed":"{{floorsPressed}}"},["Floor by floor"]]]]," ",["span",{"class":"mdl-hint"},["Drag the model to turn it"]]," ",["div",{"class":"mdl-icons"},[" ",["button",{"type":"button","onClick":"{{zoomIn}}","aria-label":"Zoom in"},["+"]]," ",["button",{"type":"button","onClick":"{{zoomOut}}","aria-label":"Zoom out"},["−"]]," ",["button",{"type":"button","onClick":"{{resetView}}","aria-label":"Reset the view"},[["svg",{"aria-hidden":"true","width":"18","
