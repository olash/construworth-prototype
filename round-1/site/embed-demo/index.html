<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Embed demo | Construworth Consult</title>
<style>
  :root { --ink:#1B1C1E; --muted:#5D5E61; --line:#D6D3CB; --bg:#FFFFFF; --soft:#F3F2EE; --accent:#E8731C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .host-bar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--line); }
  .host-bar .in { max-width: 1280px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .host-bar b { font-size: 15px; }
  .host-bar span { font-size: 13px; color: var(--muted); }
  .pick { display: flex; gap: 8px; flex-wrap: wrap; }
  .pick a { font-size: 14px; padding: 8px 12px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
  .pick a[aria-current] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .host-foot { background: var(--soft); border-top: 1px solid var(--line); padding: 40px 16px; text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <div class="host-bar"><div class="in">
    <div><b>Your website's header</b><br><span>Stand-in for the WordPress header. Everything below it is one iframe.</span></div>
    <nav class="pick" aria-label="Embedded page">
      <a href="?page=home">Landing page</a>
      <a href="?page=projects">Projects</a>
      <a href="?page=case">Case study</a>
      <a href="?page=onl">ONL</a>
      <a href="?page=mekuwen">Mekuwen</a>
    </nav>
  </div></div>

  <iframe id="cw" title="Construworth Consult" data-cw-offset="80" allow="fullscreen"></iframe>

  <div class="host-foot">Your website's footer</div>

  <script>
    (function () {
      var pages = { home: '/embed/', projects: '/embed/projects/', case: '/embed/projects/j77a/', onl: '/embed/projects/onl/', mekuwen: '/embed/projects/mekuwen/' };
      var key = new URLSearchParams(location.search).get('page') || 'home';
      if (!pages[key]) key = 'home';
      document.querySelector('.pick a[href="?page=' + key + '"]').setAttribute('aria-current', 'page');
      document.getElementById('cw').src = location.origin + pages[key];
      var s = document.createElement('script');
      s.src = location.origin + '/embed.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
