lyurethane waterproofing', 126, 'm²', 14000], ['Stepped longspan aluminium sheet', 205, 'm²', 16500], ['Galvanised steel roof framing', 1, 'item', 4000000, 'PC']]],\n      ['E', 'Staircases', [['Reinforced concrete stairs', 8, 'm³', 195000], ['Bar reinforcement', 0.96, 't', 1450000], ['Ceramic floor tiles to stairs', 13, 'm²', 55000], ['Toughened glass terrace handrail', 1, 'item', 3200000, 'PC']]],\n      ['F', 'External walls', [['230mm sandcrete blockwork', 765, 'm²', 24000], ['150mm sandcrete blockwork', 16, 'm²', 18000], ['100mm sandcrete blockwork', 43, 'm²', 15000]]],\n      ['G', 'Internal walls', [['230mm sandcrete blockwork', 1291, 'm²', 24000], ['150mm sandcrete blockwork', 179, 'm²', 18000], ['100mm sandcrete blockwork', 85, 'm²', 15000]]],\n      ['H', 'Windows & ext. doors', [['Powder-coated aluminium windows & doors', 1, 'item', 64000000, 'PC'], ['Security doors', 1, 'item', 51000000, 'PC'], ['Automated roller shutter door', 1, 'item', 5000000, 'PC'], ['Reinforced concrete lintels & hoods', 21, 'm³', 185000]]],\n      ['J', 'Internal doors', [['Timber flush doors & ironmongery', 1, 'item', 56000000, 'PC'], ['Hardwood door subframes', 30, 'nr', 85000], ['Install doors complete', 30, 'nr', 45000]]],\n      ['M', 'Floor finishes', [['Vitrified floor tiles 1000×1000', 1005, 'm²', 58000], ['Marble floor slab', 17, 'm²', 95000], ['30mm cement & sand screed', 1075, 'm²', 4500], ['Cementitious waterproofing, wet areas', 213, 'm²', 9000]]],\n      ['N', 'Wall finishes', [['Internal render, 12mm', 3419, 'm²', 3800], ['POP screeding', 3419, 'm²', 2500], ['Glazed wall tiles', 685, 'm²', 52000], ['Porcelain external cladding', 823, 'm²', 62000], ['Emulsion paint, 3 coats', 3419, 'm²', 2200]]],\n      ['P', 'Ceiling finishes', [['Suspended plasterboard ceiling', 904, 'm²', 14500], ['Moisture-resistant board, wet areas', 188, 'm²', 17500], ['Emulsion to ceilings', 1092, 'm²', 2000], ['Undefined ceiling works', 1, 'item', 2000000, 'PS']]],\n      ['Q', 'Fittings & furnishing', [['Store shelving, closets & wardrobes', 1, 'item', 30000000, 'PC'], ['Kitchen cabinets & equipment', 1, 'item', 100000000, 'PC'], ['Granite vanity tops', 20, 'm', 75000]]]\n    ];\n    const els = B.map(([code, name, rows]) => {\n      const rr = rows.map(([d, q, u, rate, tag]) => ({ d, q: n0(q), u, rate: tag ? '—' : n0(rate), amt: n2(q * rate), val: q * rate, tag: tag || '', tagBg: tag === 'PC' ? '#E8731C' : '#C9D3DE' }));\n      return { code, name, rows: rr, total: rr.reduce((a, r) => a + r.val, 0) };\n    });\n    const bill2 = els.reduce((a, e) => a + e.total, 0);\n    const elements = els.map((e) => ({ code: e.code, name: e.name, short: short(e.total), pressed: e.code === S.el ? 'true' : 'false',\n      bg: e.code === S.el ? '#1B1C1E' : 'transparent', fg: e.code === S.el ? '#F3F2EE' : '#1B1C1E', codeColor: e.code === S.el ? '#F0A066' : '#A4460B', pick: () => this.setState({ el: e.code }) }));\n    const selE = els.find((e) => e.code === S.el) || els[0];\n    const sel = { ...selE, totalFmt: naira(selE.total) };\n    const bill3 = 68500000, bill4 = 212000000, cont = 30000000;\n    const bill1 = Math.round((bill2 + bill3 + bill4) * 0.06);\n    const sub = bill1 + bill2 + bill3 + bill4 + cont;\n    const vat = sub * 0.075;\n    const summary = [\n      { k: 'Bill No. 1 — Preliminaries', v: n2(bill1) }, { k: 'Bill No. 2 — Main building', v: n2(bill2) },\n      { k: 'Bill No. 3 — External works', v: n2(bill3) }, { k: 'Bill No. 4 — M&E services', v: n2(bill4) },\n      { k: 'Contingency', v: n2(cont) }, { k: 'Add VAT 7.5%', v: n2(vat) }\n    ].map((s) => ({ ...s, w: 400, bg: 'transparent' })).concat([{ k: 'Tender sum', v: naira(sub + vat), w: 600, bg: '#F1EEE7' }]);\n\n    // ---------- Cash flow ----------\n    const sumsVals = [250e6, 500e6, 1e9];\n    const C = sumsVals[S.sum];\n    const pct = [2, 3, 5, 8, 11, 13, 14, 13, 11, 9, 7, 4];\n    const labels = ['Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb'];\n    const fullLabels = ['March 2026', 'April 2026', 'May 2026', 'June 2026', 'July 2026', 'August 2026', 'September 2026', 'October 2026', 'November 2026', 'December 2026', 'January 2027', 'February 2027'];\n    const maxP = 14;\n    let cum = 0; const cumArr = pct.map((p) => (cum += p));\n    const pt = (i) => ((i + 0.5) * 100).toFixed(0) + ',' + (290 - cumArr[i] * 2.7).toFixed(1);\n    const planPts = '0,290 ' + pct.map((_, i) => pt(i)).join(' ');\n    const actPts = '0,290 ' + pct.slice(0, S.month + 1).map((_, i) => pt(i)).join(' ');\n    const months = pct.map((p, i) => ({ label: labels[i], h: (p / maxP * 72).toFixed(1) + '%',\n      bg: i === S.month ? '#E8731C' : (i \u003c S.month ? '#D9CBB9' : '#E6E3DC'), pressed: i === S.month ? 'true' : 'false',\n      aria: fullLabels[i] + ', ' + p + '% of the contract', pick: () => this.setState({ month: i }) }));\n    const m = S.month, gross = C * pct[m] / 100, ret = gross * 0.05;\n    const mobRec = S.mob ? gross * 0.15 : 0;\n    const last = m === 11, moiety = last ? C * 0.025 : 0;\n    const net = gross - ret - mobRec + moiety, mvat = net * 0.075;\n    const lines = [\n      { k: 'Gross value of work this month', v: n2(gross) },\n      { k: 'Less retention 5%', v: '(' + n2(ret) + ')' }\n    ];\n    if (S.mob) lines.push({ k: 'Less mobilisation recovered (15%)', v: '(' + n2(mobRec) + ')' });\n    if (last) lines.push({ k: 'Add release of moiety 2.5%', v: n2(moiety) });\n    lines.push({ k: 'Add VAT 7.5%', v: n2(mvat) });\n    const cur = { full: fullLabels[m].toUpperCase(), label: labels[m].toUpperCase(), cumPct: cumArr[m] + '%', cumAmt: short(C * cumArr[m] / 100),\n      lines: lines.map((l) => ({ ...l, w: 400, bg: 'transparent' })).concat([{ k: 'Amount due to contractor', v: naira(net + mvat), w: 600, bg: '#F1EEE7' }]),\n      note: last ? 'Practical completion: half of the retention held so far (the \"moiety\", 2.5% of the contract) is released to the contractor this month.'\n        : (m \u003c 3 ? 'Early months are light — site set-up and substructure. Spend accelerates as the frame goes up.' : (m \u003c 8 ? 'Peak spend: frame, roof and envelope are all moving at once. This is where cost control matters most.' : 'Spend tapers into finishes and services. Retention keeps 5% back until the job is done.')) };\n    const sums = sumsVals.map((v, i) => ({ label: short(v), pressed: i === S.sum ? 'true' : 'false', bg: i === S.sum ? '#E8731C' : 'transparent', pick: () => this.setState({ sum: i }) }));\n\n    // ---------- Valuation ----------\n    const matVals = [0, 5e6, 12e6];\n    const work = C * S.work / 100, mat = matVals[S.mat], g = work + mat;\n    const retain = g * 0.05, released = S.pc ? retain / 2 : 0;\n    const prevPct = Math.max(0, S.work - 9);\n    const prev = C * prevPct / 100 * 0.95;\n    const vnet = g - retain + released - prev, vv = Math.max(0, vnet) * 0.075;\n    const vlines = [\n      { k: 'Value of work executed to date', v: n2(work) },\n      { k: 'Add materials on site', v: n2(mat) },\n      { k: 'Gross valuation', v: n2(g), w: 600, bg: '#F3F2EE' },\n      { k: 'Less retention 5%', v: '(' + n2(retain) + ')' }\n    ];\n    if (S.pc) vlines.push({ k: 'Add retention released at practical completion', v: n2(released) });\n    vlines.push({ k: 'Less previous certificates', v: '(' + n2(prev) + ')' });\n    vlines.push({ k: 'Net amount', v: n2(vnet), w: 600, bg: '#F3F2EE' });\n    vlines.push({ k: 'Add VAT 7.5%', v: n2(vv) });\n    const val = { work: S.work, workPct: S.work + '%', no: Math.max(1, Math.round(S.work / 12)),\n      lines: vlines.map((l) => ({ w: 400, bg: 'transparent', ...l })), due: naira(Math.max(0, vnet + vv)) };\n    const mats = matVals.map((v, i) => ({ label: v ? short(v) : 'None', pressed: i === S.mat ? 'true' : 'false', bg: i === S.mat ? '#E8731C' : 'transparent', pick: () => this.setState({ mat: i }) }));\n\n    // ---------- tabs & explainer ----------\n    const T = [['01', 'Bill of Quantities', 'bill-no-2-main-building.cw'], ['02', 'Cash flow projection', 'cash-flow-projection.cw'], ['03', 'Interim valuation', 'interim-valuation.cw']];\n    const tabs = T.map((t, i) => ({ n: t[0], label: t[1], pressed: i === S.tab ? 'true' : 'false', bg: i === S.tab ? '#1B1C1E' : 'transparent', fg: i === S.tab ? '#F3F2EE' : '#1B1C1E', num: i === S.tab ? '#F0A066' : '#A4460B', pick: () => this.setState({ tab: i }) }));\n    const EX = [\n      { title: 'Every item, measured and priced.', body: 'We measure every material and task from the drawings into one list. Every contractor prices the same list, so bids can be compared line by line — and the client knows exactly what they are paying for.',\n        terms: [{ k: 'PC sum (Prime Cost)', v: 'An allowance for specialist items chosen later, such as windows or kitchens.' }, { k: 'PS (Provisional Sum)', v: 'Money set aside for work that is not yet fully defined.' }, { k: 'Carried to collection', v: 'Page totals roll up into element totals, then into the general summary.' }], cta: 'Get your project measured' },\n      { title: 'When the money goes out.', body: 'A cash flow projection tells the client how much they will need, month by month, so funding is in place before the contractor asks for it. Spend follows an S-curve: slow start, fast middle, long tail.',\n        terms: [{ k: 'Retention (5%)', v: 'Held back from each payment as security that defects get fixed.' }, { k: 'Moiety (2.5%)', v: 'Half of the retention, released at practical completion.' }, { k: 'Mobilisation advance', v: 'An upfront payment to get the contractor on site, recovered from later payments.' }], cta: 'Plan your project funding' },\n      { title: 'Pay for work done. Nothing more.', body: 'Every month we measure progress on site, value it against the Bill of Quantities, and certify what the contractor is owed. The client pays on our certificate.',\n        terms: [{ k: 'Interim certificate', v: 'The monthly payment document, signed off by the QS.' }, { k: 'Previous certificates', v: 'What has already been paid — deducted so nothing is paid twice.' }, { k: 'Final account', v: 'The last valuation, agreed after the defects liability period.' }], cta: 'Bring us in for cost control' }\n    ];\n\n\n    const PR = [['Preliminaries', 0, 11], ['A Substructure', 0, 2], ['B Frame', 3, 6], ['C Upper floors', 3, 6], ['E Staircases', 5, 6], ['D Roof', 6, 8], ['F External walls', 6, 11], ['G Internal walls', 6, 8], ['H Windows and external doors', 6, 9], ['J Internal doors', 6, 9], ['K Plumbing and mechanical', 3, 10], ['L Electrical', 3, 9], ['N Wall finishes', 7, 8], ['M Floor finishes', 9, 10], ['Q Fittings and furnishing', 9, 10], ['Lift and sanitaryware ordered', 5, 5], ['External works, gatehouse and pool', 8, 9], ['Lighting and electrical accessories', 10, 11], ['Planting', 11, 11]];\n    const MOH = ['M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D', 'J', 'F'];\n    const progRows = PR.map(([n, a, b]) => ({ n, cells: MOH.map((_, k) => ({ bg: k >= a && k \u003c= b ? (k === S.month ? '#E8731C' : '#D9B48F') : (k === S.month ? '#F1EEE7' : 'transparent') })) }));\n    const onSite = PR.filter(([n, a, b]) => S.month >= a && S.month \u003c= b).map(([n]) => n.replace(/^[A-Z] /, ''));\n    return {\n      progRows, moh: MOH, onSite: onSite.map((n) => ({ n })), onSiteCount: onSite.length,\n      tabs, fileName: T[S.tab][2], isBoq: S.tab === 0, isCash: S.tab === 1, isVal: S.tab === 2, explain: EX[S.tab],\n      elements, sel, summary,\n      sums, sumFmt: short(C), mob: S.mob, toggleMob: () => this.setState({ mob: !S.mob }),\n      months, planPts, actPts, cur,\n      val, mats, setWork: (e) => this.setState({ work: Number(e.target.value) }),\n      pc: S.pc, togglePc: () => this.setState({ pc: !S.pc })\n    };\n  }\n}\n","props":{"$preview":{"width":1440,"height":1900}}},"mobile":{"name":"Desk-Mobile","tree":[" ",["div",{"style":"font-family: 'IBM Plex Sans', sans-serif; color: #1B1C1E; background: #F3F2EE; min-height: 100%"},[" ",["header",{"style":"display: flex; align-items: cen }\n.d{font-family:'Archivo',sans-serif;font-stretch:78%;letter-spacing:-0.01em}\n.m{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}\ninput[type=range]{accent-color:#E8731C}\n"],"links":["https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"],"script":"\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { tab: 0, el: 'A', sum: 1, month: 6, work: 62, pc: false }; }\n  renderVals() {\n    const S = this.state;\n    const n2 = (n) => n.toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n    const n0 = (n) => n.toLocaleString('en-NG', { maximumFractionDigits: 2 });\n    const naira = (n) => '₦' + n2(n);\n    const short = (n) => n >= 1e9 ? '₦' + (n / 1e9).toFixed(2) + 'bn' : '₦' + (n / 1e6).toFixed(1) + 'm';\n    const B = [\n      ['A', 'Substructure', [['Excavate to receive ground beams', 64, 'm³', 6500], ['Reinforced concrete raft', 83, 'm³', 185000], ['Reinforced concrete ground beams', 85, 'm³', 185000], ['Bar reinforcement', 26.89, 't', 1450000], ['Additional works', 1, 'item', 1000000, 'PS']]],\n      ['B', 'Frame', [['Columns', 30, 'm³', 200000], ['Beams', 53, 'm³', 190000], ['Bar reinforcement', 21.84, 't', 1450000]]],\n      ['C', 'Upper floors', [['Suspended slab', 147, 'm³', 190000], ['Bar reinforcement', 17.64, 't', 1450000]]],\n      ['D', 'Roof', [['Longspan aluminium sheet', 205, 'm²', 16500], ['Waterproofing', 126, 'm²', 14000], ['Steel roof framing', 1, 'item', 4000000, 'PC']]],\n      ['H', 'Windows & doors', [['Aluminium windows & doors', 1, 'item', 64000000, 'PC'], ['Security doors', 1, 'item', 51000000, 'PC']]],\n      ['M', 'Floor finishes', [['Vitrified floor tiles', 1005, 'm²', 58000], ['Marble floor slab', 17, 'm²', 95000]]],\n      ['Q', 'Fittings', [['Kitchen cabinets & equipment', 1, 'item', 100000000, 'PC'], ['Wardrobes & closets', 1, 'item', 30000000, 'PC']]]\n    ];\n    const els = B.map(([code, name, rows]) => {\n      const rr = rows.map(([d, q, u, rate, tag]) => ({ d, q: n0(q), u, rate: tag ? 'sum' : n0(rate), amt: n2(q * rate), val: q * rate, tag: tag || '', tagBg: tag === 'PC' ? '#E8731C' : '#C9D3DE' }));\n      return { code, name, rows: rr, total: rr.reduce((a, r) => a + r.val, 0) };\n    });\n    const elements = els.map((e) => { const open = e.code === S.el; return { ...e, open, short: short(e.total), expanded: open ? 'true' : 'false', sign: open ? '−' : '+',\n      bg: open ? '#1B1C1E' : 'transparent', fg: open ? '#F3F2EE' : '#1B1C1E', codeColor: open ? '#F0A066' : '#A4460B', pick: () => this.setState({ el: open ? null : e.code }) }; });\n    const bill2 = naira(els.reduce((a, e) => a + e.total, 0));\n\n    const sv = [250e6, 500e6, 1e9], C = sv[S.sum];\n    const pct = [2, 3, 5, 8, 11, 13, 14, 13, 11, 9, 7, 4];\n    const full = ['March 2026', 'April 2026', 'May 2026', 'June 2026', 'July 2026', 'August 2026', 'September 2026', 'October 2026', 'November 2026', 'December 2026', 'January 2027', 'February 2027'];\n    let c = 0; const cum = pct.map((p) => (c += p));\n    const pt = (i) => ((i + 0.5) * 100) + ',' + (290 - cum[i] * 2.7).toFixed(1);\n    const m = S.month, gross = C * pct[m] / 100, ret = gross * 0.05, last = m === 11, moiety = last ? C * 0.025 : 0;\n    const net = gross - ret + moiety, vat = net * 0.075;\n    const lines = [{ k: 'Gross value this month', v: n2(gross) }, { k: 'Less retention 5%', v: '(' + n2(ret) + ')' }];\n    if (last) lines.push({ k: 'Add moiety 2.5%', v: n2(moiety) });\n    lines.push({ k: 'Add VAT 7.5%', v: n2(vat) });\n    const cur = { full: full[m], cumPct: cum[m] + '%', lines: lines.map((l) => ({ ...l, w: 400, bg: 'transparent' })).concat([{ k: 'Amount due', v: naira(net + vat), w: 600, bg: '#F1EEE7' }]),\n      note: last ? 'Half the retention is released at practical completion.' : (m \u003c 8 && m > 2 ? 'Peak spend — frame, roof and envelope at once.' : 'Spend is lighter at the start and the finish.') };\n\n    const work = C * S.work / 100, retain = work * 0.05, rel = S.pc ? retain / 2 : 0, prev = C * Math.max(0, S.work - 9) / 100 * 0.95;\n    const vnet = work - retain + rel - prev, vv = Math.max(0, vnet) * 0.075;\n    const vl = [{ k: 'Work executed to date', v: n2(work) }, { k: 'Less retention 5%', v: '(' + n2(retain) + ')' }];\n    if (S.pc) vl.push({ k: 'Add retention released', v: n2(rel) });\n    vl.push({ k: 'Less previous certificates', v: '(' + n2(prev) + ')' }, { k: 'Add VAT 7.5%', v: n2(vv) });\n\n    const T = ['Bill of Quantities', 'Cash flow', 'Valuation'];\n\n    const PR = [['Preliminaries', 0, 11], ['A Substructure', 0, 2], ['B Frame', 3, 6], ['C Upper floors', 3, 6], ['E Staircases', 5, 6], ['D Roof', 6, 8], ['F External walls', 6, 11], ['G Internal walls', 6, 8], ['H Windows and external doors', 6, 9], ['J Internal doors', 6, 9], ['K Plumbing and mechanical', 3, 10], ['L Electrical', 3, 9], ['N Wall finishes', 7, 8], ['M Floor finishes', 9, 10], ['Q Fittings and furnishing', 9, 10], ['Lift and sanitaryware ordered', 5, 5], ['External works, gatehouse and pool', 8, 9], ['Lighting and electrical accessories', 10, 11], ['Planting', 11, 11]];\n    const MOH = ['M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D', 'J', 'F'];\n    const progRows = PR.map(([n, a, b]) => ({ n, cells: MOH.map((_, k) => ({ bg: k >= a && k \u003c= b ? (k === S.month ? '#E8731C' : '#D9B48F') : (k === S.month ? '#F1EEE7' : 'transparent') })) }));\n    const onSite = PR.filter(([n, a, b]) => S.month >= a && S.month \u003c= b).map(([n]) => n.replace(/^[A-Z] /, ''));\n    return {\n      progRows, moh: MOH, onSite: onSite.map((n) => ({ n })), onSiteCount: onSite.length,\n      tabs: T.map((l, i) => ({ label: l, pressed: i === S.tab ? 'true' : 'false', bg: i === S.tab ? '#1B1C1E' : 'transparent', fg: i === S.tab ? '#F3F2EE' : '#1B1C1E', pick: () => this.setState({ tab: i }) })),\n      isBoq: S.tab === 0, isCash: S.tab === 1, isVal: S.tab === 2,\n      elements, bill2,\n      sums: sv.map((v, i) => ({ label: short(v), pressed: i === S.sum ? 'true' : 'false', bg: i === S.sum ? '#E8731C' : 'transparent', pick: () => this.setState({ sum: i }) })),\n      months: pct.map((p, i) => ({ h: (p / 14 * 72).toFixed(1) + '%', bg: i === m ? '#E8731C' : (i \u003c m ? '#D9CBB9' : '#E6E3DC'), pressed: i === m ? 'true' : 'false', aria: full[i] + ', ' + p + '%', pick: () => this.setState({ month: i }) })),\n      planPts: '0,290 ' + pct.map((_, i) => pt(i)).join(' '), actPts: '0,290 ' + pct.slice(0, m + 1).map((_, i) => pt(i)).join(' '),\n      month: m, setMonth: (e) => this.setState({ month: Number(e.target.value) }), cur,\n      val: { work: S.work, workPct: S.work + '%', no: Math.max(1, Math.round(S.work / 12)), lines: vl.map((l) => ({ w: 400, bg: 'transparent', ...l })), due: naira(Math.max(0, vnet + vv)) },\n      setWork: (e) => this.setState({ work: Number(e.target.value) }), pc: S.pc, togglePc: () => this.setState({ pc: !S.pc })\n    };\n  }\n}\n","props":{"$preview":{"width":390,"height":2700}}}},"comps":{"J77A-Model":{"name":"J77A-Model","tree":[" ",["div",{"style":"font-family: 'IBM Plex Sans', sans-serif; color: #EDEBE6; background: #121314; border: 1px solid #2A2B2E"},[" "," ",["div",{"style":"display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid #2A2B2E"},[" ",["div",{"role":"group","aria-label":"Model view","style":"display: flex; border: 1px solid #4A4B4F"},[" ",["button",{"type":"button","onClick":"{{toBuild}}","aria-pressed":"{{buildPressed}}","style":"min-height: 44px; padding: 0 16px; border: 0; background: {{buildBg}}; color: {{buildFg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"},["The build"]]," ",["button",{"type":"button","onClick":"{{toFloors}}","aria-pressed":"{{floorsPressed}}","style":"min-height: 44px; padding: 0 16px; border: 0; border-left: 1px solid #4A4B4F; background: {{floorsBg}}; color: {{floorsFg} at up = 0.5 + 0.5 * n.z;\\n' +\n    ' vec3 c = vCol * (0.42 + 0.50 * d) + vCol * vec3(0.05, 0.07, 0.10) * up;\\n' +\n    ' if (vStage == cur && uProg \u003c 8.0) { float front = 1.0 - smoothstep(0.0, 0.9, cut - vW.z); c = mix(c, uAccent, 0.14 + 0.6 * front); }\\n' +\n    ' float dist = length(uEye - vW); c = mix(c, uBg, clamp((dist - 60.0) / 160.0, 0.0, 0.5));\\n' +\n    ' o = vec4(c, uAlpha);\\n' +\n    '}';\n  var GVS = '#version 300 es\\nin vec2 aP; uniform mat4 uMVP; uniform float uZg; uniform vec4 uR; out vec2 vP;\\n' +\n    'void main(){ vec2 p = mix(uR.xy, uR.zw, aP); vP = p; gl_Position = uMVP * vec4(p, uZg, 1.0); }';\n  var GFS = '#version 300 es\\nprecision highp float; in vec2 vP; out vec4 o; uniform vec3 uBg; uniform vec3 uLine; uniform vec2 uC; uniform float uRad;\\n' +\n    'float g(float s){ vec2 q = abs(fract(vP / s - 0.5) - 0.5) / fwidth(vP / s); return 1.0 - min(min(q.x, q.y), 1.0); }\\n' +\n    'void main(){ float r = length(vP - uC) / uRad; float fade = 1.0 - smoothstep(0.35, 1.0, r);\\n' +\n    ' float l = max(g(1.0) * 0.35, g(5.0)); vec3 c = mix(uBg, uLine, l * 0.5 * fade); o = vec4(c, 1.0); }';\n  var P = prog(VS, FS), G = prog(GVS, GFS);\n  var U = {}; ['uMVP', 'uMin', 'uSpan', 'uProg', 'uClip', 'uSun', 'uMode', 'uAlpha', 'uAccent', 'uEye', 'uBg', 'uGhost'].forEach(function (k) { U[k] = gl.getUniformLocation(P, k); });\n  var uZ = gl.getUniformLocation(P, 'uZ');\n  var UG = {}; ['uMVP', 'uZg', 'uR', 'uBg', 'uLine', 'uC', 'uRad'].forEach(function (k) { UG[k] = gl.getUniformLocation(G, k); });\n\n  var chunks = data.chunks.map(function (c) {\n    var vao = gl.createVertexArray(); gl.bindVertexArray(vao);\n    var pb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pb); gl.bufferData(gl.ARRAY_BUFFER, c.pos, gl.STATIC_DRAW);\n    var la = gl.getAttribLocation(P, 'aPos'); gl.enableVertexAttribArray(la); gl.vertexAttribPointer(la, 3, gl.UNSIGNED_SHORT, true, 0, 0);\n    var cb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cb); gl.bufferDat
